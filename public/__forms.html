<!doctype html>
<html lang="en">
  <head>
    <title>FreeBizKit contact form</title>
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="contact" type="hidden" /><input name="bot-field" /><input
        name="name"
      /><input name="email" type="email" /><input name="category" /><textarea
        name="message"
      ></textarea>
    </form>
  </body>
</html>
